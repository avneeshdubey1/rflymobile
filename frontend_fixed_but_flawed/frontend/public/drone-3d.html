<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>3D Drone Model</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            height: 100%;
            width: 100%;
        }
        
        #canvas-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ---------- SCENE SETUP ----------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = null;

        const camera = new THREE.PerspectiveCamera(55, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(3.2, 2.4, 3.6);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true
        });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // ---------- LIGHTING ----------
        const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
        keyLight.position.set(4, 6, 4);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.set(1024, 1024);
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0x88aaff, 0.35);
        fillLight.position.set(-4, 2, -3);
        scene.add(fillLight);

        const rimLight = new THREE.PointLight(0xd97757, 0.6, 20);
        rimLight.position.set(-2, 1, 3);
        scene.add(rimLight);

        const ambient = new THREE.AmbientLight(0xffffff, 0.45);
        scene.add(ambient);

        // ---------- MATERIALS ----------
        const bodyMat = new THREE.MeshStandardMaterial({
            color: 0x1a1d21,
            metalness: 0.55,
            roughness: 0.35
        });
        const armMat = new THREE.MeshStandardMaterial({
            color: 0x2b2f36,
            metalness: 0.5,
            roughness: 0.4
        });
        const bladeMat = new THREE.MeshStandardMaterial({
            color: 0x111214,
            metalness: 0.3,
            roughness: 0.55,
            side: THREE.DoubleSide
        });
        const hubMat = new THREE.MeshStandardMaterial({
            color: 0x3a3f47,
            metalness: 0.7,
            roughness: 0.25
        });
        const accentMat = new THREE.MeshStandardMaterial({
            color: 0xd97757,
            metalness: 0.4,
            roughness: 0.35,
            emissive: 0xd97757,
            emissiveIntensity: 0.15
        });
        const legMat = new THREE.MeshStandardMaterial({
            color: 0x15171a,
            metalness: 0.4,
            roughness: 0.5
        });

        // ---------- DRONE GROUP ----------
        const drone = new THREE.Group();
        scene.add(drone);

        // Central body — faceted diamond-ish core to echo the icon's body shape
        const bodyGeo = new THREE.OctahedronGeometry(0.55, 0);
        bodyGeo.scale(1, 0.55, 1);
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.castShadow = true;
        body.receiveShadow = true;
        drone.add(body);

        // Small accent strip on top of the body
        const accentGeo = new THREE.BoxGeometry(0.5, 0.05, 0.14);
        const accent = new THREE.Mesh(accentGeo, accentMat);
        accent.position.y = 0.18;
        drone.add(accent);

        // Camera gimbal ball underneath
        const gimbalGeo = new THREE.SphereGeometry(0.16, 16, 16);
        const gimbal = new THREE.Mesh(gimbalGeo, hubMat);
        gimbal.position.y = -0.32;
        gimbal.castShadow = true;
        drone.add(gimbal);
        const lensGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.05, 16);
        const lens = new THREE.Mesh(lensGeo, new THREE.MeshStandardMaterial({
            color: 0x0a0a0a,
            metalness: 0.9,
            roughness: 0.1
        }));
        lens.rotation.x = Math.PI / 2;
        lens.position.set(0, -0.4, 0.06);
        drone.add(lens);

        // ---------- ARMS + ROTORS (X configuration, matching the icon) ----------
        const armLength = 1.15;
        const armAngles = [45, 135, 225, 315]; // degrees, X-frame like the reference icon
        const rotors = [];

        armAngles.forEach((deg) => {
            const rad = THREE.MathUtils.degToRad(deg);
            const armGroup = new THREE.Group();
            armGroup.rotation.y = rad;
            drone.add(armGroup);

            // Arm (tapered box)
            const armGeo = new THREE.BoxGeometry(armLength, 0.07, 0.09);
            const arm = new THREE.Mesh(armGeo, armMat);
            arm.position.x = armLength / 2;
            arm.castShadow = true;
            arm.receiveShadow = true;
            armGroup.add(arm);

            // Motor hub at end of arm
            const motorGeo = new THREE.CylinderGeometry(0.11, 0.13, 0.16, 20);
            const motor = new THREE.Mesh(motorGeo, hubMat);
            motor.position.set(armLength, 0.08, 0);
            motor.castShadow = true;
            armGroup.add(motor);

            // Landing leg
            const legGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.4, 8);
            const leg = new THREE.Mesh(legGeo, legMat);
            leg.position.set(armLength * 0.75, -0.25, 0);
            leg.rotation.z = THREE.MathUtils.degToRad(12);
            armGroup.add(leg);
            const footGeo = new THREE.BoxGeometry(0.18, 0.02, 0.06);
            const foot = new THREE.Mesh(footGeo, legMat);
            foot.position.set(armLength * 0.75 + 0.05, -0.44, 0);
            armGroup.add(foot);

            // Propeller (2 blades) — pivots for spin animation
            const propPivot = new THREE.Group();
            propPivot.position.set(armLength, 0.17, 0);
            armGroup.add(propPivot);

            const bladeShape = new THREE.Shape();
            bladeShape.moveTo(0, 0);
            bladeShape.quadraticCurveTo(0.28, 0.05, 0.5, 0.02);
            bladeShape.quadraticCurveTo(0.3, -0.04, 0, 0);
            const bladeGeo = new THREE.ExtrudeGeometry(bladeShape, {
                depth: 0.015,
                bevelEnabled: false
            });

            const blade1 = new THREE.Mesh(bladeGeo, bladeMat);
            blade1.rotation.x = Math.PI / 2;
            propPivot.add(blade1);

            const blade2 = new THREE.Mesh(bladeGeo, bladeMat);
            blade2.rotation.x = Math.PI / 2;
            blade2.rotation.y = Math.PI;
            propPivot.add(blade2);

            rotors.push(propPivot);
        });

        // ---------- GROUND SHADOW CATCHER ----------
        const groundGeo = new THREE.PlaneGeometry(20, 20);
        const groundMat = new THREE.ShadowMaterial({
            opacity: 0.18
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -1.4;
        ground.receiveShadow = true;
        scene.add(ground);

        // ---------- INTERACTION (drag to orbit) ----------
        let isDragging = false;
        let prevX = 0,
            prevY = 0;
        let targetRotY = 0.6,
            targetRotX = 0.15;
        let currentRotY = 0.6,
            currentRotX = 0.15;

        function onPointerDown(x, y) {
            isDragging = true;
            prevX = x;
            prevY = y;
        }

        function onPointerMove(x, y) {
            if (!isDragging) return;
            const dx = x - prevX,
                dy = y - prevY;
            targetRotY += dx * 0.008;
            targetRotX = THREE.MathUtils.clamp(targetRotX + dy * 0.006, -0.6, 0.9);
            prevX = x;
            prevY = y;
        }

        function onPointerUp() {
            isDragging = false;
        }

        renderer.domElement.addEventListener('mousedown', e => onPointerDown(e.clientX, e.clientY));
        window.addEventListener('mousemove', e => onPointerMove(e.clientX, e.clientY));
        window.addEventListener('mouseup', onPointerUp);
        renderer.domElement.addEventListener('touchstart', e => onPointerDown(e.touches[0].clientX, e.touches[0].clientY), {
            passive: true
        });
        window.addEventListener('touchmove', e => {
            if (isDragging) onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
        }, {
            passive: true
        });
        window.addEventListener('touchend', onPointerUp);

        // ---------- ANIMATION LOOP ----------
        const radius = 3.0;
        let hoverT = 0;

        function animate() {
            requestAnimationFrame(animate);

            // Auto-idle rotation when not dragging
            if (!isDragging) targetRotY += 0.0025;

            currentRotY += (targetRotY - currentRotY) * 0.08;
            currentRotX += (targetRotX - currentRotX) * 0.08;

            camera.position.x = radius * Math.sin(currentRotY) * Math.cos(currentRotX);
            camera.position.z = radius * Math.cos(currentRotY) * Math.cos(currentRotX);
            camera.position.y = radius * Math.sin(currentRotX) + 1.0;
            camera.lookAt(0, -0.1, 0);

            // Gentle hover bob
            hoverT += 0.02;
            drone.position.y = Math.sin(hoverT) * 0.06;
            drone.rotation.z = Math.sin(hoverT * 0.7) * 0.02;

            // Spin propellers — alternate direction per rotor, like a real quad
            rotors.forEach((r, i) => {
                r.rotation.y += (i % 2 === 0 ? 1 : -1) * 1.4;
            });

            renderer.render(scene, camera);
        }
        animate();

        // ---------- RESIZE ----------
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>

</html>
