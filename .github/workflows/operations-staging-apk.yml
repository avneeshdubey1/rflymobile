name: operations-staging-apk

on:
  push:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: operations-staging-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-staging-apk:
    name: build Operations staging APK
    runs-on: [self-hosted, linux, rfly-onprem]
    timeout-minutes: 60
    env:
      APP_ENV: staging
      EXPO_PUBLIC_OC_API_URL: https://operations-staging-api.example.invalid
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v4

      - name: Refuse non-staging or stale source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin refs/heads/staging:refs/remotes/origin/staging
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/staging)" = "$GITHUB_SHA" || {
            echo 'The requested revision is not the current staging branch tip.' >&2
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: operations-mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install pinned Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'cmake;3.22.1' \
            'ndk;27.1.12297006'

      - name: Validate Operations source
        working-directory: operations-mobile
        run: |
          npm ci
          npm audit --omit=dev --audit-level=critical
          npm run typecheck
          npm test -- --runInBand
          npm run doctor

      - name: Generate native Android staging project
        working-directory: operations-mobile
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .expo node_modules/.cache android
          npx expo prebuild --platform android --clean --no-install

      - name: Build bundled standalone staging APK
        working-directory: operations-mobile
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/.gradle android/app/build
          chmod +x android/gradlew
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' android/gradle.properties
          sed -i 's/^org.gradle.parallel=.*/org.gradle.parallel=false/' android/gradle.properties
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' android/gradle.properties
          ./android/gradlew -p android :app:assembleRelease \
            --no-build-cache \
            --no-daemon --max-workers=2

      - name: Verify and package staging APK evidence
        shell: bash
        run: |
          set -euo pipefail
          source_apk='operations-mobile/android/app/build/outputs/apk/release/app-release.apk'
          test -s "$source_apk"
          artifact_dir="$RUNNER_TEMP/rfly-operations-companion-staging-${GITHUB_SHA}"
          mkdir -p "$artifact_dir"
          cp "$source_apk" "$artifact_dir/rfly-operations-companion-staging.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            "$artifact_dir/rfly-operations-companion-staging.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging \
            "$artifact_dir/rfly-operations-companion-staging.apk" \
            | grep -q "package: name='com.rfly.operations.staging'"
          apk_permissions="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions \
            "$artifact_dir/rfly-operations-companion-staging.apk")"
          for forbidden_permission in \
            android.permission.ACCESS_BACKGROUND_LOCATION \
            android.permission.FOREGROUND_SERVICE_LOCATION \
            android.permission.READ_EXTERNAL_STORAGE \
            android.permission.WRITE_EXTERNAL_STORAGE \
            android.permission.SYSTEM_ALERT_WINDOW; do
            if grep -q "$forbidden_permission" <<< "$apk_permissions"; then
              echo "Forbidden Android permission present: $forbidden_permission" >&2
              exit 1
            fi
          done
          sha256sum "$artifact_dir/rfly-operations-companion-staging.apk" \
            > "$artifact_dir/rfly-operations-companion-staging.apk.sha256"
          {
            echo "source_sha=$GITHUB_SHA"
            echo 'variant=staging'
            echo 'api_url=https://operations-staging-api.example.invalid'
            echo 'package_id=com.rfly.operations.staging'
            echo 'build_type=release'
            echo 'distribution=internal-only'
            echo 'metro_required=false'
            date -u '+built_at=%Y-%m-%dT%H:%M:%SZ'
          } > "$artifact_dir/build-metadata.txt"
          echo "APK_ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"

      - name: Upload internal staging APK
        uses: actions/upload-artifact@v4
        with:
          name: rfly-operations-companion-staging-${{ github.sha }}
          path: ${{ env.APK_ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 7
