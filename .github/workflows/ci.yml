name: application-and-container-gates

on:
  pull_request:
  push:
    branches: [main, staging, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: operations_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d operations_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      OPERATING_TIME_ZONE: UTC
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/operations_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Generate process-local test secrets
        shell: bash
        run: |
          {
            echo "RECOVERY_HASH_SECRET=$(openssl rand -hex 48)"
            echo "OTP_HASH_SECRET=$(openssl rand -hex 48)"
            echo "OTP_DELIVERY_PROVIDER=test"
            echo "DEMO_USER_PASSWORD=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run prisma:validate
      - run: node node_modules/prisma/build/index.js migrate deploy
      - name: Enable test database mutation
        run: psql -h 127.0.0.1 -U postgres -d operations_test -c 'ALTER DATABASE operations_test SET "rfly.allow_history_mutation" = '"'"'on'"'"';'
      - run: node prisma/seed.js
      - name: Backend tests
        run: node --test --test-concurrency=1 --test-force-exit tests/*.test.js

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The current React Router advisory applies only to unstable RSC APIs;
      # this application is a client-side Vite SPA and does not enable RSC.
      # Keep critical findings blocking while upstream publishes a compatible
      # patched react-router-dom release.
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run lint
      - name: Production same-origin build
        env:
          VITE_API_URL: /
        run: npm run build

  pilot-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pilot-mobile
    env:
      RFLY_APP_VARIANT: production
      EXPO_PUBLIC_API_URL: https://pilot-ci.example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pilot-mobile/package-lock.json
      - run: npm ci
      # Expo SDK 57 currently carries high-severity build-tool findings through
      # Metro/image-size without a compatible non-breaking remediation. Keep
      # critical runtime findings blocking and retain the high findings as a
      # tracked upstream release gate; never use npm audit fix --force here.
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npm run doctor

  operations-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: operations-mobile
    env:
      EXPO_PUBLIC_OC_API_URL: https://operations-ci.example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: operations-mobile/package-lock.json
      - run: npm ci
      # Expo SDK 57 runtime/build audit rules apply identically here.
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npm run doctor

  isolated-container-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend, pilot-mobile, operations-mobile]
    steps:
      - uses: actions/checkout@v4
      - name: Create ephemeral file-mounted secrets and deployment environment
        shell: bash
        run: |
          set -euo pipefail
          secret_dir="$RUNNER_TEMP/operations-secrets"
          mkdir -p "$secret_dir"
          chmod 700 "$secret_dir"
          umask 077
          openssl rand -base64 36 > "$secret_dir/db_password"
          openssl rand -base64 48 > "$secret_dir/recovery_hash_secret"
          openssl rand -base64 48 > "$secret_dir/otp_hash_secret"
          openssl rand -hex 32 > "$secret_dir/import_staging_key"
          mkdir -p "$RUNNER_TEMP/import-input"
          chmod 0755 "$RUNNER_TEMP/import-input"
          printf 'intentionally-invalid-workbook\n' > "$RUNNER_TEMP/import-input/invalid.xlsx"
          chmod 0444 "$RUNNER_TEMP/import-input/invalid.xlsx"
          chmod 0444 "$secret_dir/db_password" "$secret_dir/recovery_hash_secret" "$secret_dir/otp_hash_secret" "$secret_dir/import_staging_key"
          cat > "$RUNNER_TEMP/operations-ci.env" <<EOF
          DEPLOYMENT_NAME=operations-ci-${GITHUB_RUN_ID}
          IMAGE_TAG=ci-${GITHUB_SHA}
          APP_BIND_ADDRESS=127.0.0.1
          APP_PORT=18080
          CORS_ALLOWED_ORIGINS=https://ci.example.invalid
          MAP_FRAME_ORIGINS=https://www.openstreetmap.org
          TRUST_PROXY_HOPS=2
          OPERATING_TIME_ZONE=UTC
          POSTGRES_USER=operations
          POSTGRES_DB=operations
          DB_PASSWORD_FILE=$secret_dir/db_password
          RECOVERY_HASH_SECRET_FILE=$secret_dir/recovery_hash_secret
          OTP_HASH_SECRET_FILE=$secret_dir/otp_hash_secret
          IMPORT_STAGING_KEY_FILE=$secret_dir/import_staging_key
          IMPORT_STAGING_KEY_VERSION=ci-v1
          IMPORT_WORKBOOK_DIRECTORY=$RUNNER_TEMP/import-input
          IMPORTER_UID=$(id -u)
          IMPORTER_GID=$(id -g)
          OTP_DELIVERY_PROVIDER=disabled
          EOF
          echo "DEPLOY_ENV=$RUNNER_TEMP/operations-ci.env" >> "$GITHUB_ENV"
      - name: Validate rendered Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file "$DEPLOY_ENV" -f compose.production.yml config --quiet
          docker compose --env-file "$DEPLOY_ENV" -f compose.production.yml -f compose.onprem-staging.yml config --quiet
          docker compose --env-file "$DEPLOY_ENV" -f compose.production.yml -f compose.import.yml config --quiet
          import_config="$(docker compose --env-file "$DEPLOY_ENV" \
            -f compose.production.yml -f compose.import.yml config --format json)"
          jq -e '
            .services["importer-preflight"] as $preflight
            | .services.importer as $importer
            | .services["client-master-importer-preflight"] as $client_preflight
            | .services["client-master-importer"] as $client_importer
            | $preflight.network_mode == "none"
              and (($preflight.secrets // []) | length == 0)
              and (($preflight.depends_on // {}) | length == 0)
              and $preflight.read_only
              and ($preflight.cap_drop | index("ALL") != null)
              and ($preflight.security_opt | index("no-new-privileges:true") != null)
              and ($importer.networks | has("data"))
              and (($importer.networks | has("edge")) | not)
              and (($importer.secrets // []) | length == 2)
              and $client_preflight.network_mode == "none"
              and (($client_preflight.secrets // []) | length == 0)
              and (($client_preflight.depends_on // {}) | length == 0)
              and $client_preflight.read_only
              and ($client_preflight.cap_drop | index("ALL") != null)
              and ($client_preflight.security_opt | index("no-new-privileges:true") != null)
              and ($client_importer.networks | has("data"))
              and (($client_importer.networks | has("edge")) | not)
              and (($client_importer.secrets // []) | length == 1)
          ' <<< "$import_config" >/dev/null
      - name: Build and start isolated stack
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker compose --env-file "$DEPLOY_ENV" -f compose.production.yml pull db \
              && docker compose --env-file "$DEPLOY_ENV" -f compose.production.yml build \
              && docker compose --env-file "$DEPLOY_ENV" -f compose.production.yml -f compose.import.yml build importer importer-preflight client-master-importer client-master-importer-preflight; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Container image preparation failed after $attempt attempts." >&2
              exit 1
            fi
            delay=$((attempt * 10))
            echo "Container registry request failed; retrying in ${delay}s (attempt $((attempt + 1))/3)." >&2
            sleep "$delay"
          done

          docker compose --env-file "$DEPLOY_ENV" -f compose.production.yml up --detach --no-build --wait --wait-timeout 180

          curl --fail --silent --show-error http://127.0.0.1:18080/healthz | grep -q '"status":"ok"'
          curl --fail --silent --show-error \
            -H 'Host: ci.example.invalid' \
            -H 'X-Forwarded-Proto: https' \
            http://127.0.0.1:18080/api/health | grep -q '"status":"ok"'

          db_container="$(docker compose --env-file "$DEPLOY_ENV" -f compose.production.yml ps -q db)"
          backend_container="$(docker compose --env-file "$DEPLOY_ENV" -f compose.production.yml ps -q backend)"
          db_published_ports="$(docker container inspect "$db_container" --format '{{range $port, $bindings := .NetworkSettings.Ports}}{{if $bindings}}{{range $bindings}}{{println .HostPort}}{{end}}{{end}}{{end}}')"
          backend_published_ports="$(docker container inspect "$backend_container" --format '{{range $port, $bindings := .NetworkSettings.Ports}}{{if $bindings}}{{range $bindings}}{{println .HostPort}}{{end}}{{end}}{{end}}')"
          if [ -n "$db_published_ports" ]; then
            echo "db service unexpectedly publishes host ports: $db_published_ports" >&2
            exit 1
          fi
          if [ -n "$backend_published_ports" ]; then
            echo "backend service unexpectedly publishes host ports: $backend_published_ports" >&2
            exit 1
          fi

          backend_user="$(docker image inspect "field-operations-backend:ci-${GITHUB_SHA}" --format '{{.Config.User}}')"
          frontend_user="$(docker image inspect "field-operations-frontend:ci-${GITHUB_SHA}" --format '{{.Config.User}}')"
          migration_user="$(docker image inspect "field-operations-migration:ci-${GITHUB_SHA}" --format '{{.Config.User}}')"
          importer_user="$(docker image inspect "field-operations-importer:ci-${GITHUB_SHA}" --format '{{.Config.User}}')"
          test "$backend_user" = node || { echo "backend image must run as node, got '$backend_user'" >&2; exit 1; }
          test "$frontend_user" = nginx || { echo "frontend image must run as nginx, got '$frontend_user'" >&2; exit 1; }
          test "$migration_user" = node || { echo "migration image must run as node, got '$migration_user'" >&2; exit 1; }
          test "$importer_user" = node || { echo "importer image must run as node, got '$importer_user'" >&2; exit 1; }

          # Exercise the parser boundary as the non-root host-mapped operator.
          # The invalid fixture must be readable but rejected safely, and this
          # service has no network, database secret, key, or migration dependency.
          if docker compose --env-file "$DEPLOY_ENV" -f compose.production.yml -f compose.import.yml \
            run --rm --no-deps importer-preflight preflight --file /imports/input/invalid.xlsx \
            > "$RUNNER_TEMP/import-preflight.out" 2>&1; then
            echo "Importer preflight unexpectedly accepted an invalid workbook." >&2
            exit 1
          fi
          grep -q '"ok":false' "$RUNNER_TEMP/import-preflight.out"
          grep -q '"error":"INVALID_ZIP"' "$RUNNER_TEMP/import-preflight.out"

          if docker compose --env-file "$DEPLOY_ENV" -f compose.production.yml -f compose.import.yml \
            run --rm --no-deps client-master-importer-preflight preflight --file /imports/input/invalid.xlsx \
            > "$RUNNER_TEMP/client-master-import-preflight.out" 2>&1; then
            echo "Client-master importer preflight unexpectedly accepted an invalid workbook." >&2
            exit 1
          fi
          grep -q '"ok":false' "$RUNNER_TEMP/client-master-import-preflight.out"
          grep -q '"error":"INVALID_ZIP"' "$RUNNER_TEMP/client-master-import-preflight.out"
      - name: Print container diagnostics after failure
        if: failure()
        run: |
          docker compose --env-file "$DEPLOY_ENV" -f compose.production.yml ps --all || true
          docker compose --env-file "$DEPLOY_ENV" -f compose.production.yml logs --no-color --tail=200 || true
      - name: Remove ephemeral stack
        if: always()
        run: docker compose --env-file "$DEPLOY_ENV" -f compose.production.yml down --volumes --remove-orphans || true

  pilot-staging-apk:
    name: build standalone Pilot staging APK on office server
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: [backend, frontend, pilot-mobile, isolated-container-stack]
    runs-on: [self-hosted, linux, rfly-onprem]
    timeout-minutes: 60
    environment: onprem-staging
    env:
      CI: '1'
      RFLY_APP_VARIANT: staging
      EXPO_PUBLIC_API_URL: http://172.20.96.10:8089
    steps:
      - name: Checkout CI-passed staging source
        uses: actions/checkout@v4

      - name: Refuse non-staging or stale source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            refs/heads/staging:refs/remotes/origin/staging
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/staging)" || {
            echo "The requested revision is not the current staging tip." >&2
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pilot-mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install pinned Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'cmake;3.22.1' \
            'ndk;27.1.12297006'

      - name: Validate Pilot source
        working-directory: pilot-mobile
        run: |
          npm ci
          npm run typecheck
          npm test -- --runInBand
          npm run doctor

      - name: Generate native Android staging project
        working-directory: pilot-mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build bundled standalone staging APK
        working-directory: pilot-mobile
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' android/gradle.properties
          sed -i 's/^org.gradle.parallel=.*/org.gradle.parallel=false/' android/gradle.properties
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' android/gradle.properties
          ./android/gradlew -p android :app:assembleRelease --no-daemon --max-workers=2

      - name: Verify and package APK evidence
        shell: bash
        run: |
          set -euo pipefail
          source_apk='pilot-mobile/android/app/build/outputs/apk/release/app-release.apk'
          test -s "$source_apk"
          artifact_dir="$RUNNER_TEMP/rfly-pilot-staging-${GITHUB_SHA}"
          mkdir -p "$artifact_dir"
          cp "$source_apk" "$artifact_dir/rfly-pilot-staging.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            "$artifact_dir/rfly-pilot-staging.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging \
            "$artifact_dir/rfly-pilot-staging.apk" \
            | grep -q "package: name='com.rfly.pilot.staging'"
          apk_permissions="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions \
            "$artifact_dir/rfly-pilot-staging.apk")"
          grep -q 'android.permission.ACCESS_FINE_LOCATION' <<< "$apk_permissions"
          for forbidden_permission in \
            android.permission.ACCESS_BACKGROUND_LOCATION \
            android.permission.FOREGROUND_SERVICE_LOCATION \
            android.permission.READ_EXTERNAL_STORAGE \
            android.permission.WRITE_EXTERNAL_STORAGE \
            android.permission.SYSTEM_ALERT_WINDOW; do
            if grep -q "$forbidden_permission" <<< "$apk_permissions"; then
              echo "Forbidden Android permission present: $forbidden_permission" >&2
              exit 1
            fi
          done
          sha256sum "$artifact_dir/rfly-pilot-staging.apk" \
            > "$artifact_dir/rfly-pilot-staging.apk.sha256"
          {
            echo "source_sha=$GITHUB_SHA"
            echo 'variant=staging'
            echo 'api_url=http://172.20.96.10:8089'
            echo 'distribution=internal-debug-signed-release-apk'
            echo 'metro_required=false'
          } > "$artifact_dir/build-metadata.txt"
          echo "APK_ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"

      - name: Upload installable staging APK
        uses: actions/upload-artifact@v4
        with:
          name: rfly-pilot-staging-${{ github.sha }}
          path: ${{ env.APK_ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 7

  operations-capacitor-apk:
    name: build standalone Operations Capacitor staging APK on office server
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: [backend, frontend, pilot-mobile, isolated-container-stack]
    runs-on: [self-hosted, linux, rfly-onprem]
    timeout-minutes: 60
    environment: onprem-staging
    env:
      CI: '1'
      VITE_API_URL: http://172.20.96.10:8089
    steps:
      - name: Checkout CI-passed staging source
        uses: actions/checkout@v4

      - name: Refuse non-staging or stale source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            refs/heads/staging:refs/remotes/origin/staging
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/staging)" || {
            echo "The requested revision is not the current staging tip." >&2
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install pinned Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'cmake;3.22.1' \
            'ndk;27.1.12297006'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Vite production bundle for staging
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: frontend
        run: npx cap sync android

      - name: Generate branded Operations Android assets
        working-directory: frontend
        run: npm run assets:android

      - name: Build Operations Capacitor staging APK
        working-directory: frontend/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' gradle.properties
          sed -i 's/^org.gradle.parallel=.*/org.gradle.parallel=false/' gradle.properties
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2

      - name: Verify and package APK evidence
        shell: bash
        run: |
          set -euo pipefail
          source_apk='frontend/android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$source_apk"
          artifact_dir="$RUNNER_TEMP/rfly-operations-staging-${GITHUB_SHA}"
          mkdir -p "$artifact_dir"
          cp "$source_apk" "$artifact_dir/rfly-operations-staging.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            "$artifact_dir/rfly-operations-staging.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging \
            "$artifact_dir/rfly-operations-staging.apk" \
            | grep -q "package: name='com.rfly.operations.staging'"
          apk_permissions="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions \
            "$artifact_dir/rfly-operations-staging.apk")"
          for forbidden_permission in \
            android.permission.ACCESS_BACKGROUND_LOCATION \
            android.permission.FOREGROUND_SERVICE_LOCATION \
            android.permission.READ_EXTERNAL_STORAGE \
            android.permission.WRITE_EXTERNAL_STORAGE \
            android.permission.SYSTEM_ALERT_WINDOW; do
            if grep -q "$forbidden_permission" <<< "$apk_permissions"; then
              echo "Forbidden Android permission present: $forbidden_permission" >&2
              exit 1
            fi
          done
          sha256sum "$artifact_dir/rfly-operations-staging.apk" \
            > "$artifact_dir/rfly-operations-staging.apk.sha256"
          {
            echo "source_sha=$GITHUB_SHA"
            echo 'variant=staging'
            echo 'api_url=http://172.20.96.10:8089'
            echo 'package_id=com.rfly.operations.staging'
            echo 'build_type=debug'
            echo 'signing=debug-signed'
            echo 'distribution=internal-only'
          } > "$artifact_dir/build-metadata.txt"
          echo "APK_ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"

      - name: Upload installable Operations staging APK
        uses: actions/upload-artifact@v4
        with:
          name: rfly-operations-staging-${{ github.sha }}
          path: ${{ env.APK_ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 7
