name: onprem-staging-auto-deploy

on:
  workflow_run:
    workflows: [application-and-container-gates]
    branches: [staging]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: onprem-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy staging to internal office server
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, rfly-onprem]
    timeout-minutes: 30
    environment: onprem-staging
    steps:
      - name: Checkout CI-passed staging source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Refuse a stale CI result
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            refs/heads/staging:refs/remotes/origin/staging
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/staging)" || {
            echo "The successful CI revision is no longer the staging branch tip; refusing rollback." >&2
            exit 1
          }

      - name: Show source revision
        run: git rev-parse HEAD

      - name: Deploy isolated internal staging stack
        env:
          DEPLOY_ENV: /opt/client-staging-app/deployment.env
          DEPLOY_CHANGELOG: /opt/client-staging-app/deployment-notes/CHANGELOG.md
          DEPLOY_COMPOSE_OVERRIDE: compose.onprem-staging.yml
        run: bash deploy/onprem-selfhosted-deploy.sh
