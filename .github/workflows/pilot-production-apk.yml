name: pilot-production-apk

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full main commit SHA already deployed to office production
        required: true
        type: string
      confirmation:
        description: Type BUILD_INTERNAL_PILOT_PRODUCTION_APK
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pilot-production-apk
  cancel-in-progress: false

jobs:
  build:
    name: build approved Pilot production-pointed APK
    runs-on: [self-hosted, linux, rfly-onprem]
    timeout-minutes: 60
    environment: onprem-production
    env:
      CI: '1'
      EXPO_NO_DOTENV: '1'
      RFLY_APP_VARIANT: production-internal-http
      EXPO_PUBLIC_API_URL: http://103.238.230.152:8088
    steps:
      - name: Validate explicit approval
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main' || {
            echo 'Run this workflow from the main branch only.' >&2
            exit 1
          }
          test "$CONFIRMATION" = 'BUILD_INTERNAL_PILOT_PRODUCTION_APK' || {
            echo 'The Pilot production APK confirmation phrase is incorrect.' >&2
            exit 1
          }
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'source_sha must be a full 40-character Git commit SHA.' >&2
            exit 1
          }

      - name: Checkout requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Refuse non-main or stale source
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          test "$(git rev-parse origin/main)" = "$REQUESTED_SHA" || {
            echo 'The requested revision is not the current main branch tip.' >&2
            exit 1
          }

      - name: Verify matching production deployment and mobile API
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          actual_image="$(docker inspect rfly-onprem-demo-frontend-1 \
            --format '{{.Config.Image}}')"
          expected_image="field-operations-frontend:${REQUESTED_SHA}"
          test "$actual_image" = "$expected_image" || {
            echo "Production runs ${actual_image}; expected ${expected_image}." >&2
            exit 1
          }
          docker inspect rfly-onprem-demo-backend-1 \
            --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -qx 'MOBILE_API_ENABLED=true' || {
              echo 'The production mobile API is not enabled.' >&2
              exit 1
            }
          curl --fail --silent --show-error \
            http://127.0.0.1:8088/healthz >/dev/null
          curl --fail --silent --show-error \
            http://127.0.0.1:8088/api/health >/dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pilot-mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install pinned Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'cmake;3.22.1' \
            'ndk;27.1.12297006'

      - name: Validate Pilot source
        working-directory: pilot-mobile
        run: |
          npm ci
          npm audit --omit=dev --audit-level=critical
          npm run typecheck
          npm test -- --runInBand
          npm run doctor

      - name: Generate native Android production project
        working-directory: pilot-mobile
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .expo node_modules/.cache android
          npx expo prebuild --platform android --clean --no-install

      - name: Build bundled standalone production-pointed APK
        working-directory: pilot-mobile
        shell: bash
        run: |
          set -euo pipefail
          export GRADLE_USER_HOME="$RUNNER_TEMP/gradle-pilot-production-${GITHUB_RUN_ID}"
          rm -rf android/.gradle android/app/build
          chmod +x android/gradlew
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' android/gradle.properties
          sed -i 's/^org.gradle.parallel=.*/org.gradle.parallel=false/' android/gradle.properties
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' android/gradle.properties
          ./android/gradlew -p android clean :app:assembleRelease \
            --no-daemon --max-workers=2

      - name: Verify and package production APK evidence
        shell: bash
        run: |
          set -euo pipefail
          source_apk='pilot-mobile/android/app/build/outputs/apk/release/app-release.apk'
          test -s "$source_apk"
          artifact_dir="$RUNNER_TEMP/rfly-pilot-production-${GITHUB_SHA}"
          mkdir -p "$artifact_dir"
          cp "$source_apk" "$artifact_dir/rfly-pilot-production.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            "$artifact_dir/rfly-pilot-production.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging \
            "$artifact_dir/rfly-pilot-production.apk" \
            | grep -q "package: name='com.rfly.pilot'"
          bundle_file="$RUNNER_TEMP/rfly-pilot-production-index.android.bundle"
          unzip -p "$artifact_dir/rfly-pilot-production.apk" \
            assets/index.android.bundle > "$bundle_file"
          test -s "$bundle_file"
          grep -aFq 'http://103.238.230.152:8088' "$bundle_file" || {
            echo 'Production API URL is missing from the packaged JavaScript bundle.' >&2
            exit 1
          }
          for forbidden_api_url in \
            'http://172.20.96.10:8089' \
            'http://localhost' \
            'http://127.0.0.1'; do
            if grep -aFq "$forbidden_api_url" "$bundle_file"; then
              echo "Forbidden API URL is embedded in production APK: ${forbidden_api_url}" >&2
              exit 1
            fi
          done
          apk_permissions="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions \
            "$artifact_dir/rfly-pilot-production.apk")"
          grep -q 'android.permission.ACCESS_FINE_LOCATION' <<< "$apk_permissions"
          for forbidden_permission in \
            android.permission.ACCESS_BACKGROUND_LOCATION \
            android.permission.FOREGROUND_SERVICE_LOCATION \
            android.permission.READ_EXTERNAL_STORAGE \
            android.permission.WRITE_EXTERNAL_STORAGE \
            android.permission.SYSTEM_ALERT_WINDOW; do
            if grep -q "$forbidden_permission" <<< "$apk_permissions"; then
              echo "Forbidden Android permission present: $forbidden_permission" >&2
              exit 1
            fi
          done
          sha256sum "$artifact_dir/rfly-pilot-production.apk" \
            > "$artifact_dir/rfly-pilot-production.apk.sha256"
          {
            echo "source_sha=$GITHUB_SHA"
            echo 'variant=production-internal-http'
            echo 'api_url=http://103.238.230.152:8088'
            echo 'package_id=com.rfly.pilot'
            echo 'build_type=release'
            echo 'signing=internal-debug-signed'
            echo 'distribution=internal-only'
            echo 'metro_required=false'
            echo 'tls=not-configured-credentials-and-tokens-not-encrypted-in-transit'
            date -u '+built_at=%Y-%m-%dT%H:%M:%SZ'
          } > "$artifact_dir/build-metadata.txt"
          echo "APK_ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"

      - name: Upload internal production Pilot APK
        uses: actions/upload-artifact@v4
        with:
          name: rfly-pilot-production-${{ github.sha }}
          path: ${{ env.APK_ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 7
