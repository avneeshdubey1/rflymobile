name: onprem-auto-deploy

on:
  workflow_run:
    workflows: [application-and-container-gates]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: onprem-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy main to office on-prem server
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, rfly-onprem]
    timeout-minutes: 30
    environment: onprem-production
    steps:
      - name: Recover stale checkout locks
        shell: bash
        run: |
          set -euo pipefail
          git_directory="${GITHUB_WORKSPACE}/.git"
          if [ -d "$git_directory" ]; then
            find "$git_directory" -type f -name '*.lock' -print -delete
          fi

      - name: Checkout CI-passed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Refuse a stale CI result
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "The successful CI revision is no longer the main branch tip; refusing rollback." >&2
            exit 1
          }

      - name: Show source revision
        run: git rev-parse HEAD

      - name: Deploy isolated on-prem stack
        env:
          DEPLOY_ENV: /opt/client-demo-app/deployment.env
          DEPLOY_CHANGELOG: /opt/client-demo-app/deployment-notes/CHANGELOG.md
        run: bash deploy/onprem-selfhosted-deploy.sh
