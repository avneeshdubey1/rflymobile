name: release-image-evidence

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-scan-and-publish:
    name: build, scan, sbom, publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            target: runtime
            image_suffix: backend
          - component: migration
            context: ./backend
            dockerfile: ./backend/Dockerfile
            target: migration
            image_suffix: migration
          - component: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            target: runtime
            image_suffix: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Normalize image prefix
        id: image_prefix
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image_prefix.outputs.value }}-${{ matrix.image_suffix }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Generate SBOM artifact
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ steps.image_prefix.outputs.value }}-${{ matrix.image_suffix }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.component }}.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.component }}
          path: sbom-${{ matrix.component }}.spdx.json
          if-no-files-found: error

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.image_prefix.outputs.value }}-${{ matrix.image_suffix }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.component }}-sarif
          path: trivy-${{ matrix.component }}.sarif
          if-no-files-found: error

      - name: Upload Trivy SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: trivy-${{ matrix.component }}

      - name: Write image digest evidence
        shell: bash
        run: |
          mkdir -p release-evidence
          cat > "release-evidence/${{ matrix.component }}.json" <<EOF
          {
            "component": "${{ matrix.component }}",
            "image": "${{ env.REGISTRY }}/${{ steps.image_prefix.outputs.value }}-${{ matrix.image_suffix }}",
            "digest": "${{ steps.build.outputs.digest }}",
            "source_sha": "${{ github.sha }}",
            "workflow_run": "${{ github.run_id }}"
          }
          EOF

      - name: Upload image digest evidence
        uses: actions/upload-artifact@v4
        with:
          name: image-evidence-${{ matrix.component }}
          path: release-evidence/${{ matrix.component }}.json
          if-no-files-found: error
