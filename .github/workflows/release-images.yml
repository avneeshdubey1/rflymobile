name: release-image-evidence

on:
  workflow_run:
    workflows: [application-and-container-gates]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: release-images-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  build-scan-and-publish:
    name: build, scan, sbom, publish
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            target: runtime
            image_suffix: backend
          - component: migration
            context: ./backend
            dockerfile: ./backend/Dockerfile
            target: migration
            image_suffix: migration
          - component: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            target: runtime
            image_suffix: frontend
          - component: importer
            context: ./backend
            dockerfile: ./backend/Dockerfile
            target: importer
            image_suffix: importer

    steps:
      - name: Checkout CI-passed source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Refuse a stale CI result
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "The successful CI revision is no longer the main branch tip; refusing image publication." >&2
            exit 1
          }

      - uses: docker/setup-buildx-action@v3

      - name: Normalize image prefix
        id: image_prefix
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image_prefix.outputs.value }}-${{ matrix.image_suffix }}
          tags: |
            type=raw,value=sha-${{ env.SOURCE_SHA }}

      - name: Build local scan candidate
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: rfly-scan-${{ matrix.component }}:${{ env.SOURCE_SHA }}
          provenance: false
          sbom: false

      - name: Block publication on fixable high or critical image findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rfly-scan-${{ matrix.component }}:${{ env.SOURCE_SHA }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Generate SBOM artifact
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ steps.image_prefix.outputs.value }}-${{ matrix.image_suffix }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.component }}.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.component }}
          path: sbom-${{ matrix.component }}.spdx.json
          if-no-files-found: error

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.image_prefix.outputs.value }}-${{ matrix.image_suffix }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.component }}-sarif
          path: trivy-${{ matrix.component }}.sarif
          if-no-files-found: error

      - name: Write image digest evidence
        shell: bash
        run: |
          mkdir -p release-evidence
          cat > "release-evidence/${{ matrix.component }}.json" <<EOF
          {
            "component": "${{ matrix.component }}",
            "image": "${{ env.REGISTRY }}/${{ steps.image_prefix.outputs.value }}-${{ matrix.image_suffix }}",
            "digest": "${{ steps.build.outputs.digest }}",
            "source_sha": "${{ env.SOURCE_SHA }}",
            "workflow_run": "${{ github.run_id }}"
          }
          EOF

      - name: Upload image digest evidence
        uses: actions/upload-artifact@v4
        with:
          name: image-evidence-${{ matrix.component }}
          path: release-evidence/${{ matrix.component }}.json
          if-no-files-found: error
