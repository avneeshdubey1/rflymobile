<body class="bg-background text-on-background min-h-screen flex flex-col pt-[48px] pb-20 md:pb-0">
<!-- TopAppBar (Transactional - Hidden Nav Shell Context, but maintaining header as instructed) -->
<header class="fixed top-0 w-full z-50 bg-primary text-on-primary flex items-center justify-between px-margin-mobile h-touch-target-min transition-colors duration-200">
<button aria-label="Back" class="flex items-center justify-center w-12 h-12 text-on-primary hover:bg-primary-container/20 transition-colors duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-primary">Pilot Field</h1>
<div class="w-12 h-12 flex items-center justify-center">
<!-- Trailing icon placeholder for alignment -->
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 w-full max-w-3xl mx-auto px-margin-mobile py-stack-lg">
<div class="mb-stack-md">
<h2 class="font-headline-lg text-headline-lg text-on-background mb-stack-sm">Select Copilot</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Search or select an eligible copilot for the current assignment.</p>
</div>
<!-- Search Field -->
<div class="relative mb-stack-lg">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">search</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline rounded bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary font-body-lg text-body-lg h-touch-target-min" placeholder="Search by name or ID (e.g., OP-1242)" type="text"/>
</div>
<!-- Candidate List -->
<div class="flex flex-col gap-stack-sm">
<!-- Candidate Item 1 -->
<button class="w-full flex items-center justify-between p-4 bg-surface-container-low border border-outline-variant rounded hover:bg-surface-container-high transition-colors text-left h-[72px] focus:outline-none focus:ring-2 focus:ring-primary">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-headline-sm text-headline-sm shrink-0">
                        VS
                    </div>
<div>
<div class="font-headline-sm text-headline-sm text-on-surface">Vikram S.</div>
<div class="font-label-md text-label-md text-on-surface-variant mt-1">OP-1242</div>
</div>
</div>
<div class="text-secondary">
<span class="material-symbols-outlined">chevron_right</span>
</div>
</button>
<!-- Candidate Item 2 -->
<button class="w-full flex items-center justify-between p-4 bg-surface-container-low border border-outline-variant rounded hover:bg-surface-container-high transition-colors text-left h-[72px] focus:outline-none focus:ring-2 focus:ring-primary">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-headline-sm text-headline-sm shrink-0">
                        SK
                    </div>
<div>
<div class="font-headline-sm text-headline-sm text-on-surface">Sarah K.</div>
<div class="font-label-md text-label-md text-on-surface-variant mt-1">OP-8834</div>
</div>
</div>
<div class="text-secondary">
<span class="material-symbols-outlined">chevron_right</span>
</div>
</button>
</div>
</main>
