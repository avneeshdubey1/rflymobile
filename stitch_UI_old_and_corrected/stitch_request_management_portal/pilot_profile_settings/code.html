<style>
        /* Custom styles for the toggle switch to match standard input feel */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #000000;
        }
        .toggle-checkbox {
            right: 24px;
            z-index: 1;
        }
        .toggle-label {
             width: 48px;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #000000;
        }
        .toggle-checkbox:not(:checked) + .toggle-label {
            background-color: #c6c6cd;
        }
    </style>
<script>
        // Simple toggle interaction logic for demonstration
        document.querySelectorAll('input[type="checkbox"].toggle-checkbox').forEach(toggle => {
            toggle.addEventListener('change', function() {
                const label = this.nextElementSibling;
                if(this.checked) {
                    label.style.backgroundColor = '#000000';
                    this.style.borderColor = '#000000';
                    this.style.transform = 'translateX(24px)';
                } else {
                     label.style.backgroundColor = '#c6c6cd';
                     this.style.borderColor = '#c6c6cd';
                     this.style.transform = 'translateX(0)';
                }
            });
            // Initial state check
             if(toggle.checked) {
                 toggle.style.transform = 'translateX(24px)';
             }
        });
    </script>
