<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

                        "on-error": "#ffffff",
                        "on-error-container": "#93000a",
                        "success": "#16a34a",
                        "on-secondary": "#ffffff",
                        "surface-tint": "#565e74",

                        "label-md": ["IBM Plex Sans"],

<body class="bg-background text-on-background antialiased min-h-screen flex flex-col pt-16 pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="bg-primary dark:bg-primary-container text-on-primary dark:text-on-primary-container font-headline-md text-headline-md fixed top-0 w-full z-50 flex items-center justify-between px-margin-mobile h-touch-target-min transition-colors duration-200">
<button aria-label="Menu" class="flex items-center justify-center w-touch-target-min h-touch-target-min hover:bg-primary-container/20 transition-colors rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">menu</span>
</button>
<span class="font-headline-md text-headline-md font-bold text-on-primary dark:text-on-primary-container">Pilot Field</span>
<button aria-label="Sync" class="flex items-center justify-center w-touch-target-min h-touch-target-min hover:bg-primary-container/20 transition-colors rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">sync</span>
</button>
</header>
<!-- Main Canvas -->
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile md:max-w-2xl md:mx-auto w-full">
<div class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-stack-lg flex flex-col gap-stack-lg shadow-sm">
<div class="text-center flex flex-col gap-stack-sm">
<span class="material-symbols-outlined text-4xl text-secondary-container mx-auto" style="font-variation-settings: 'FILL' 1;">rocket_launch</span>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Start Mission</h1>
</div>
<div class="bg-surface border border-outline-variant rounded-lg p-stack-md flex flex-col gap-stack-sm">
<h2 class="font-label-lg text-label-lg text-on-surface-variant uppercase tracking-wider">Mission Details</h2>
<div class="flex justify-between items-center py-2 border-b border-outline-variant/50">
<span class="font-body-md text-body-md text-on-surface-variant">Location</span>
<span class="font-label-md text-label-md text-on-surface font-semibold">Field Alpha - Corn</span>
</div>
<div class="flex justify-between items-center py-2">
<span class="font-body-md text-body-md text-on-surface-variant">Sector</span>
<span class="font-label-md text-label-md text-on-surface font-semibold">7G</span>
</div>
</div>
<div class="bg-error-container/20 border border-error/30 rounded-lg p-stack-md flex items-start gap-stack-md">
<span class="material-symbols-outlined text-error mt-1" style="font-variation-settings: 'FILL' 1;">warning</span>
<p class="font-body-md text-body-md text-on-surface">Ensure all pre-flight safety checks are complete and the zone is clear before starting.</p>
</div>
<div class="flex flex-col gap-stack-md mt-stack-sm">
<button class="w-full h-touch-target-min bg-secondary-container text-on-secondary-container font-label-lg text-label-lg rounded flex items-center justify-center gap-2 hover:bg-secondary transition-colors active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                    Start Mission
                </button>
<button class="w-full h-touch-target-min bg-transparent border border-outline text-on-surface font-label-lg text-label-lg rounded flex items-center justify-center hover:bg-surface-variant transition-colors active:scale-95">
                    Cancel
                </button>
</div>
</div>
</main>
<!-- BottomNavBar (Hidden per linear task rule, but included to satisfy component generation if needed, though strictly we should suppress it for a focused confirmation screen. Given the instructions "Automatic Suppression: You MUST exclude the navigation shell if the page intent is: Linear/Transactional... Task-Focused", I will omit it from the DOM entirely to prioritize the Canvas.) -->
</body></html>
