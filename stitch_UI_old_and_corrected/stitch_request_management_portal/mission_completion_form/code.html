<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pilot Field - Mission Completion</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#d8dadc",
                        "surface-container-low": "#f2f4f6",
                        "outline": "#76777d",
                        "surface-variant": "#e4e2e4",
                        "on-primary-container": "#7c839b",
                        "error": "#dc2626",
                        "tertiary-container": "#271901",
                        "tertiary": "#000000",
                        "on-background": "#1b1b1d",
                        "primary-fixed": "#dae2fd",
                        "on-secondary-container": "#5c2400",
                        "secondary": "#9d4300",
                        "inverse-surface": "#303032",
                        "on-primary-fixed": "#131b2e",
                        "on-tertiary-container": "#98805d",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "on-error-container": "#93000a",
                        "success": "#16a34a",
                        "on-secondary": "#ffffff",
                        "surface-tint": "#565e74",
                        "on-primary-fixed-variant": "#3f465c",
                        "on-secondary-fixed": "#341100",
                        "inverse-on-surface": "#f3f0f2",
                        "surface-container": "#f0edef",
                        "tertiary-fixed-dim": "#dec29a",
                        "surface-container-high": "#eae7e9",
                        "secondary-fixed": "#ffdbca",
                        "on-surface-variant": "#45464d",
                        "secondary-fixed-dim": "#ffb690",
                        "on-surface": "#1b1b1d",
                        "tertiary-fixed": "#fcdeb5",
                        "inverse-primary": "#bec6e0",
                        "surface-container-lowest": "#ffffff",
                        "primary-container": "#131b2e",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed": "#271901",
                        "primary": "#000000",
                        "on-tertiary-fixed-variant": "#574425",
                        "surface-bright": "#fcf8fa",
                        "primary-fixed-dim": "#bec6e0",
                        "background": "#fcf8fa",
                        "on-secondary-fixed-variant": "#783200",
                        "warning": "#ca8a04",
                        "outline-variant": "#c6c6cd",
                        "on-tertiary": "#ffffff",
                        "surface-container-highest": "#e4e2e4",
                        "secondary-container": "#fd761a",
                        "surface": "#fcf8fa",
                        "surface-container-medium": "#eef1f4"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "stack-lg": "24px",
                        "gutter-mobile": "12px",
                        "stack-md": "16px",
                        "margin-mobile": "16px",
                        "touch-target-min": "48px"
                    },
                    "fontFamily": {
                        "label-md": ["IBM Plex Sans"],
                        "body-lg": ["IBM Plex Sans"],
                        "label-sm": ["IBM Plex Sans"],
                        "label-lg": ["IBM Plex Sans"],
                        "body-sm": ["IBM Plex Sans"],
                        "body-md": ["IBM Plex Sans"],
                        "headline-lg": ["IBM Plex Sans"],
                        "headline-md": ["IBM Plex Sans"],
                        "headline-sm": ["IBM Plex Sans"]
                    },
                    "fontSize": {
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-sm": ["11px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "headline-sm": ["16px", { "lineHeight": "24px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background antialiased pt-[64px] min-h-screen flex flex-col">
<!-- TopAppBar (Transactional - Hidden/Modified per rules, but showing close to exit) -->
<header class="fixed top-0 w-full z-50 bg-primary dark:bg-primary-container flex items-center justify-between px-margin-mobile h-touch-target-min transition-colors duration-200">
<button aria-label="Close" class="w-12 h-12 flex items-center justify-center text-on-primary dark:text-on-primary-container hover:bg-primary-container/20 transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-primary dark:text-on-primary-container">Pilot Field</h1>
<div class="w-12 h-12"></div> <!-- Spacer for balance -->
</header>
<main class="flex-grow w-full max-w-2xl mx-auto px-margin-mobile py-stack-lg flex flex-col gap-stack-lg">
<!-- Header Section -->
<section class="flex flex-col gap-stack-sm border-b border-outline-variant pb-stack-md">
<div class="flex items-center justify-between">
<h2 class="font-headline-lg text-headline-lg text-primary">Mission Completion</h2>
<span class="bg-warning text-on-primary px-3 py-1 rounded-full font-label-md text-label-md flex items-center gap-1 shadow-sm">
<span class="material-symbols-outlined text-[14px]" data-icon="sync">sync</span>
                    Mission In Progress
                </span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">PF-11</p>
</section>
<!-- Form Section -->
<section class="bg-surface-container-low border border-outline-variant rounded-lg p-stack-md flex flex-col gap-stack-md shadow-sm">
<!-- Reference Data -->
<div class="flex flex-col gap-2 bg-surface-container-medium p-4 rounded-md border border-outline-variant border-opacity-50">
<label class="font-label-md text-label-md text-on-surface-variant">Target Acreage</label>
<div class="font-body-lg text-body-lg text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-outline" data-icon="square_foot">square_foot</span>
                    120 AC
                </div>
</div>
<!-- Input: Actual Acreage -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="actual-acreage">Actual Acreage *</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="agriculture">agriculture</span>
</div>
<input class="block w-full pl-10 pr-12 py-3 bg-surface-container-lowest border border-outline rounded-md font-body-lg text-body-lg text-on-surface focus:ring-2 focus:ring-secondary focus:border-secondary transition-all" id="actual-acreage" min="0" name="actual-acreage" placeholder="0.00" required="" step="0.01" type="number"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
<span class="font-label-md text-label-md text-outline">AC</span>
</div>
</div>
</div>
<!-- Input: Notes -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="completion-notes">Optional Completion Notes</label>
<textarea class="block w-full p-3 bg-surface-container-lowest border border-outline rounded-md font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-secondary focus:border-secondary transition-all" id="completion-notes" name="completion-notes" placeholder="Add any field observations or issues encountered..." rows="4"></textarea>
</div>
<!-- Action Button -->
<div class="pt-stack-sm">
<button class="w-full h-touch-target-min bg-secondary text-on-secondary font-headline-sm text-headline-sm rounded-md flex justify-center items-center gap-2 hover:bg-secondary-container transition-colors duration-200 active:scale-[0.98]" type="button">
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
                    Complete Mission
                </button>
</div>
</section>
</main>
<!-- BottomNavBar suppressed due to Transactional/Task-Focused Intent -->
</body></html>
