<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Pilot Field App - Copilot Confirmation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#5c2400",
                        "inverse-surface": "#2d3133",
                        "secondary-fixed-dim": "#ffb690",
                        "primary-fixed": "#dae2fd",
                        "tertiary-fixed-dim": "#b9c7e0",
                        "background": "#f7f9fb",
                        "primary-fixed-dim": "#bec6e0",
                        "on-secondary-fixed": "#341100",
                        "status-warning": "#9A3412",
                        "on-tertiary-fixed-variant": "#3a485c",
                        "on-tertiary-container": "#76859b",
                        "primary": "#000000",
                        "on-error-container": "#93000a",
                        "surface-container-low": "#f2f4f6",
                        "surface-container": "#eceef0",
                        "surface-container-lowest": "#ffffff",
                        "error-container": "#ffdad6",
                        "inverse-on-surface": "#eff1f3",
                        "surface-container-high": "#e6e8ea",
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a",
                        "status-success": "#166534",
                        "on-background": "#191c1e",
                        "outline-variant": "#c6c6cd",
                        "surface-slate": "#E2E8F0",
                        "on-error": "#ffffff",
                        "on-primary-fixed-variant": "#3f465c",
                        "surface-bright": "#f7f9fb",
                        "tertiary-container": "#0d1c2f",
                        "surface": "#f7f9fb",
                        "outline": "#76777d",
                        "surface-tint": "#565e74",
                        "on-primary-container": "#7c839b",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#191c1e",
                        "inverse-primary": "#bec6e0",
                        "on-primary-fixed": "#131b2e",
                        "status-offline": "#475569",
                        "secondary-container": "#fd761a",
                        "safety-orange": "#F97316",
                        "surface-dim": "#d8dadc",
                        "surface-container-highest": "#e0e3e5",
                        "on-secondary-fixed-variant": "#783200",
                        "secondary-fixed": "#ffdbca",
                        "secondary": "#9d4300",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#d5e3fd",
                        "tertiary": "#000000",
                        "primary-container": "#131b2e",
                        "surface-variant": "#e0e3e5",
                        "on-tertiary-fixed": "#0d1c2f",
                        "rfly-blue": "#0F172A",
                        "on-surface-variant": "#45464d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "touch-target-min": "48px",
                        "stack-md": "16px",
                        "margin-mobile": "20px",
                        "stack-lg": "24px",
                        "stack-sm": "8px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "headline-lg": ["IBM Plex Sans"],
                        "data-mono": ["JetBrains Mono"],
                        "label-caps": ["IBM Plex Sans"],
                        "body-md": ["IBM Plex Sans"],
                        "headline-md": ["IBM Plex Sans"],
                        "body-lg": ["IBM Plex Sans"],
                        "headline-lg-mobile": ["IBM Plex Sans"]
                    },
                    "fontSize": {
                        "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "data-mono": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }]

                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface h-screen w-full flex justify-center overflow-hidden">
<!-- Mobile App Container -->
<div class="w-full max-w-md h-full flex flex-col bg-surface shadow-2xl relative overflow-hidden">
<!-- Transactional Header (Custom, suppressing global navigation shell) -->
<header class="flex items-center justify-between px-margin-mobile h-touch-target-min w-full bg-surface border-b border-surface-slate z-10">
<button aria-label="Go Back" class="w-touch-target-min h-touch-target-min flex items-center justify-start text-on-surface hover:bg-surface-container-high transition-colors active:opacity-80 rounded-full -ml-3">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Confirm Selection</h1>
<div class="w-touch-target-min h-touch-target-min"></div> <!-- Spacer for alignment -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto px-margin-mobile py-stack-md flex flex-col gap-stack-lg pb-[120px]">
<!-- Status Preview Banner -->
<div class="w-full bg-surface-container-lowest border border-status-success rounded-xl p-stack-sm flex items-center gap-stack-sm shadow-sm">
<div class="w-10 h-10 rounded-full bg-status-success/10 flex items-center justify-center text-status-success shrink-0">
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
</div>
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-status-success uppercase tracking-wider">Pre-Flight Check</span>
<span class="font-body-md text-body-md font-medium text-on-surface">Ready to Start</span>
</div>
</div>
<!-- Mission Details Summary Card -->
<section class="bg-surface-container-lowest rounded-xl border border-surface-slate shadow-sm overflow-hidden flex flex-col">
<div class="bg-surface-container-low px-4 py-3 border-b border-surface-slate flex items-center justify-between">
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase">Mission Details</h2>
<span class="font-data-mono text-data-mono text-on-surface-variant">ID: M-8924</span>
</div>
<div class="p-4 flex flex-col gap-stack-sm">
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Location</span>
<span class="font-body-md text-body-md font-medium text-on-surface">Sector 4, North Ridge</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Est. Duration</span>
<span class="font-data-mono text-data-mono text-on-surface">02:45:00</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Objective</span>
<span class="font-body-md text-body-md font-medium text-on-surface">Topographic Survey</span>
</div>
</div>
</section>
<!-- Crew Selection Card -->
<section class="bg-surface-container-lowest rounded-xl border border-surface-slate shadow-sm overflow-hidden flex flex-col">
<div class="bg-surface-container-low px-4 py-3 border-b border-surface-slate flex items-center justify-between">
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase">Assigned Crew</h2>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="group">group</span>
</div>
<div class="p-4 flex flex-col gap-stack-md">
<!-- Primary Pilot -->
<div class="flex items-center gap-4">
<div class="relative">
<img class="w-12 h-12 rounded-full object-cover border-2 border-surface-slate" data-alt="A professional headshot of a seasoned drone pilot wearing tactical field gear and communication headset, outdoors under bright overcast light, highly detailed, realistic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB6EGjk5lKVXJeItziUGbfOzxCtNuC7KbOn--QIbkkL-K0PuXtaCnHSaF43syz9FpizcJBpItcgYnwHXfmMjf5H-KFRsgpH2r8xN_eEm7R8x9XF5bKctRSTlwx3W5GfTWoMy8PwhNCSSy-sZGy0bIEoSgb1jfCotxWcu9YP5Vu6e8jqBXFqutDYbZSr00QAqW0Pg2YcJ_ErJctOgArYLB3rxoXeZK6jwyOU_dfFHGnvUR4C6wReN1dd">
<div class="absolute -bottom-1 -right-1 w-5 h-5 bg-safety-orange rounded-full border-2 border-surface-container-lowest flex items-center justify-center">
<span class="material-symbols-outlined text-[12px] text-white" data-icon="star" data-weight="fill" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
</div>
<div class="flex flex-col flex-1">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Primary Pilot</span>
<span class="font-headline-md text-headline-md text-on-surface text-lg">Alex Mercer</span>
</div>
</div>
<div class="h-px w-full bg-surface-slate"></div>
<!-- Selected Copilot -->
<div class="flex items-center gap-4">
<img class="w-12 h-12 rounded-full object-cover border-2 border-surface-slate" data-alt="A professional headshot of a young drone copilot wearing technical outdoor clothing and a subtle earpiece, focused expression, standing in a rugged outdoor environment, cinematic lighting, sharp." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB57-ulOW4XyKV-MaMbN8AXsN8MnIS-WBW4AtztQHHHo1SLga8P3Y-fQ9U3Xfki1pXQtrMNDx-ZE-ZmnszwjTEApgkMRM0yS8dKE9dUMWziOZ68KzqwLdq_iS7WDCXMDEdBCiyo9-kz-3Cu6bqe2gv6p4bj0scqqf_V6-i3-GGrWWyAurU6k0JT9QEAz_6uy8JjjZq9j10MwizNDI3luLPWj0Z595vkUu_gDVjbb5IzgAPMT6cq2s9R">
<div class="flex flex-col flex-1">
<span class="font-label-caps text-label-caps text-safety-orange uppercase">Selected Copilot</span>
<span class="font-headline-md text-headline-md text-on-surface text-lg">Jordan Lee</span>
</div>
<button class="h-9 px-3 rounded-lg border border-outline-variant text-on-surface font-body-md text-body-md font-medium hover:bg-surface-container-low active:bg-surface-container-high transition-colors">
                            Change
                        </button>
</div>
</div>
</section>
</main>
<!-- Fixed Bottom Action Area -->
<div class="absolute bottom-0 w-full bg-surface-container-lowest border-t border-surface-slate p-margin-mobile pb-safe shadow-[0_-4px_16px_rgba(0,0,0,0.05)] z-20 flex flex-col gap-stack-sm">
<button class="w-full h-touch-target-min bg-rfly-blue text-white rounded-xl font-headline-md text-headline-md font-bold shadow-md hover:bg-tertiary-container active:scale-[0.98] transition-all flex items-center justify-center gap-2" onclick="window.location.href='{{DATA:SCREEN:SCREEN_12}}'">
<span class="material-symbols-outlined" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
                Confirm Selection
            </button>
<button class="w-full h-touch-target-min bg-transparent text-on-surface-variant rounded-xl font-body-lg text-body-lg font-medium hover:bg-surface-container-low active:bg-surface-container-high transition-colors">
                Cancel Mission
            </button>
</div>
</div>


</body></html>
