<div class="w-24 h-24 rounded-full bg-secondary-container flex items-center justify-center mb-base border-2 border-outline-variant">
<span class="material-symbols-outlined text-4xl text-on-secondary-container" style="font-variation-settings: 'FILL' 1;">person</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface">Alex Mercer</h2>
<p class="font-data-sm text-data-sm text-secondary bg-surface-container-high px-3 py-1 rounded-full">Pilot ID: AM-8902</p>
</section>

<section class="grid grid-cols-1 md:grid-cols-2 gap-base">
<div class="bg-surface-container-lowest border-2 border-surface-variant rounded-lg p-stack-md flex flex-col justify-between">
<div class="flex items-center gap-2 mb-2 text-secondary">
<span class="material-symbols-outlined text-lg">language</span>

<span class="font-label-caps text-label-caps uppercase">Security Clearance</span>
</div>
<div class="flex items-center justify-between">
