<style>
        body { background-color: #f8f9fa; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 1; }
    </style>

<body class="bg-surface text-on-surface h-screen flex flex-col font-body-md overflow-hidden">
<!-- TopAppBar (Transactional - Hidden Navigation Shell for Desktop, keep structural header) -->
<header class="flex items-center justify-between px-margin-mobile h-touch-target-min w-full z-50 bg-surface border-b-2 border-outline-variant">
<div class="flex items-center gap-4">
<button class="h-touch-target-min w-touch-target-min flex items-center justify-center text-primary active:scale-95 duration-100">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary">Select Copilot</h1>
</div>
<div class="flex items-center">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 0;">signal_cellular_4_bar</span>
</div>
</header>
<main class="flex-1 overflow-y-auto p-margin-mobile flex flex-col gap-stack-lg">
<!-- Search Section -->
<section class="w-full max-w-2xl mx-auto">
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary">search</span>
<input class="w-full h-touch-target-min pl-12 pr-4 bg-surface-container-lowest border-2 border-outline-variant rounded focus:border-secondary focus:ring-0 font-body-md text-on-surface placeholder:text-tertiary outline-none" placeholder="Search by name or ID..." type="text"/>
</div>
</section>
<!-- Loading State (Hidden by default) -->
<div class="hidden flex-col items-center justify-center py-12 gap-stack-md w-full max-w-2xl mx-auto" id="state-loading">
<span class="material-symbols-outlined text-primary animate-spin text-4xl">autorenew</span>
<p class="font-body-lg text-body-lg text-secondary">Searching database...</p>
</div>
<!-- Copilot List -->
<section class="w-full max-w-2xl mx-auto flex flex-col gap-base" id="state-list">
<div class="bg-surface-container-lowest border-2 border-surface-container-high rounded p-4 flex items-center justify-between active:border-secondary active:bg-surface-container-low transition-colors cursor-pointer min-h-[64px]">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container font-headline-sm text-headline-sm">
                        JD
                    </div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg font-bold text-on-surface">John Doe</span>
<span class="font-data-sm text-data-sm text-secondary">EMP-8472</span>
</div>
</div>
<div class="flex items-center gap-2">
<span class="bg-surface-container text-on-surface px-2 py-1 rounded-sm font-label-caps text-label-caps border border-surface-dim">AVAILABLE</span>
<span class="material-symbols-outlined text-secondary">chevron_right</span>
</div>
</div>
<div class="bg-surface-container-lowest border-2 border-surface-container-high rounded p-4 flex items-center justify-between active:border-secondary active:bg-surface-container-low transition-colors cursor-pointer min-h-[64px]">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container font-headline-sm text-headline-sm">
                        AS
                    </div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg font-bold text-on-surface">Alice Smith</span>
<span class="font-data-sm text-data-sm text-secondary">EMP-9921</span>
</div>
</div>
<div class="flex items-center gap-2">
<span class="bg-surface-container text-on-surface px-2 py-1 rounded-sm font-label-caps text-label-caps border border-surface-dim">AVAILABLE</span>
<span class="material-symbols-outlined text-secondary">chevron_right</span>
</div>
</div>
<div class="bg-surface-container-lowest border-2 border-surface-container-high rounded p-4 flex items-center justify-between active:border-secondary active:bg-surface-container-low transition-colors cursor-pointer min-h-[64px]">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container font-headline-sm text-headline-sm">
                        RJ
                    </div>
<div class="flex flex-col">
<span class="font-body-lg text-body-lg font-bold text-on-surface">Robert Johnson</span>
<span class="font-data-sm text-data-sm text-secondary">EMP-1024</span>
</div>
</div>
<div class="flex items-center gap-2">
<span class="bg-surface-container text-on-surface px-2 py-1 rounded-sm font-label-caps text-label-caps border border-surface-dim">AVAILABLE</span>
<span class="material-symbols-outlined text-secondary">chevron_right</span>
</div>
</div>
</section>
