<!DOCTYPE html><html class="light" lang="en" style=""><head>

                    },
                    "borderRadius": {

                    "spacing": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Subtle industrial pattern for background */
        .bg-pattern {
            background-image: radial-gradient(circle at 2px 2px, rgba(4, 22, 46, 0.05) 1px, transparent 0);
            background-size: 24px 24px;
        }
    </style>

<body class="bg-background min-h-screen flex items-center justify-center font-body-md text-on-surface bg-pattern p-margin-mobile">
<!-- Main Container -->
<main class="w-full max-w-[480px] bg-surface-container-lowest border border-surface-container rounded-xl shadow-[0px_4px_0px_rgba(0,0,0,0.05)] overflow-hidden flex flex-col">
<!-- Header Branding -->
<div class="bg-primary px-stack-lg py-stack-lg flex flex-col items-center justify-center border-b-[4px] border-secondary relative overflow-hidden">
<!-- Subtle abstract graphic behind logo -->
<div class="absolute inset-0 opacity-10 pointer-events-none">
<svg height="100%" preserveAspectRatio="none" viewBox="0 0 400 200" width="100%">
<path class="text-primary-fixed" d="M0 100 Q 100 0 200 100 T 400 100 L 400 200 L 0 200 Z" fill="currentColor"></path>
<path class="text-secondary" d="M0 150 Q 150 50 250 150 T 400 150 L 400 200 L 0 200 Z" fill="currentColor"></path>
</svg>
</div>
<div class="z-10 flex items-center gap-stack-sm text-on-primary">
<img src="https://lh3.googleusercontent.com/aida-public/AB6AXuBM6ZaEEoi73L3Z7RT4sIRJBJeTmRqLNnkIljj_zFI0SvHlLFqO-fQaQlstlb0G_C2ZMyCEnCBpTUHEaGjwWJqveuGaxM-Zm2Nc-9pnzpXT0lWiXiWLNczUWrEnFOjWVQvK5GZn62HlXpUhflDrV-rpLaVcPR4Gl92DLL5j46bygl_vyW-1EHqEn5unOhiPDYTR9CFM0D8W9tyaZOdgSUMpVm4VAZIKN83wDNn5mPBxCAlF99blST_o" alt="RFLY Drone Mark" class="h-16 w-16 object-contain">
<h1 class="font-display-lg text-display-lg tracking-tight">RFLY <span class="font-headline-sm text-headline-sm text-primary-fixed-dim">Operations</span></h1>
</div>
<p class="font-data-sm text-data-sm text-on-primary-container mt-base z-10">System v4.2.1 • Connected</p>
</div>
<!-- Content Area: Login Form (Default State) -->
<div class="p-stack-lg flex-grow flex flex-col gap-stack-lg">
<div class="flex flex-col gap-base">
<h2 class="font-headline-md text-headline-md text-primary">Secure Access</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your credentials to access the operations dashboard.</p>
</div>
<form class="flex flex-col gap-stack-md" onsubmit="event.preventDefault(); simulateLogin();">
<!-- Email Input -->
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="email">Operator ID / Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-gutter top-1/2 -translate-y-1/2 text-outline" data-icon="badge">badge</span>
<input class="w-full h-touch-target-min pl-[48px] pr-gutter bg-surface-container-lowest border-2 border-surface-container rounded-lg font-data-sm text-data-sm text-on-surface focus:border-secondary focus:ring-0 focus:outline-none transition-colors" id="email" placeholder="user@rfly.ops" required="" type="email">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-base">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="password">Passcode</label>
<a class="font-label-caps text-label-caps text-primary hover:text-secondary transition-colors" href="#">Recover Access</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-gutter top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full h-touch-target-min pl-[48px] pr-gutter bg-surface-container-lowest border-2 border-surface-container rounded-lg font-data-sm text-data-sm text-on-surface focus:border-secondary focus:ring-0 focus:outline-none transition-colors" id="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Actions -->
<div class="mt-base flex flex-col gap-stack-sm">
<button class="w-full h-touch-target-min bg-secondary text-on-secondary font-headline-sm text-headline-sm rounded-full flex items-center justify-center gap-base hover:bg-on-secondary-container transition-colors active:scale-95 duration-100" type="submit">
                        Authenticate <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
<button class="w-full h-touch-target-min bg-transparent text-primary font-body-md text-body-md rounded-lg flex items-center justify-center hover:bg-surface-container-low transition-colors" type="button">
                        Request Temporary Access
                    </button>
</div>
</form>
</div>
<!-- Footer Footer -->
<div class="p-margin-mobile bg-surface-container-low border-t border-surface-container flex items-center justify-between text-on-surface-variant">
<div class="flex items-center gap-base">
<div class="w-2 h-2 rounded-full bg-status-success animate-pulse"></div>
<span class="font-data-sm text-data-sm">Server: Online</span>
</div>
<span class="font-label-caps text-label-caps">© 2024 RFLY INC.</span>
</div>
<!-- Overlay: Loading / Initialization State (Hidden by default) -->
<div class="hidden absolute inset-0 bg-surface-container-lowest z-50 flex flex-col items-center justify-center p-stack-lg border border-surface-container rounded-xl" id="loadingOverlay">
<div class="w-16 h-16 border-4 border-surface-container border-t-secondary rounded-full animate-spin mb-stack-lg"></div>
<h2 class="font-headline-sm text-headline-sm text-primary mb-base">Initializing System</h2>
<!-- Progress List -->
<div class="w-full max-w-[300px] flex flex-col gap-base mt-stack-md">
<div class="flex justify-between items-center font-data-sm text-data-sm">
<span class="text-on-surface-variant">Authenticating...</span>
<span class="material-symbols-outlined text-status-success text-[16px]" data-icon="check_circle">check_circle</span>
</div>
<div class="flex justify-between items-center font-data-sm text-data-sm">
<span class="text-primary font-bold">Restoring Session...</span>
<span class="material-symbols-outlined text-outline animate-spin text-[16px]" data-icon="sync">sync</span>
</div>
<div class="flex justify-between items-center font-data-sm text-data-sm">
<span class="text-outline">Verifying Assets...</span>
<span class="material-symbols-outlined text-outline text-[16px]" data-icon="hourglass_empty">hourglass_empty</span>
</div>
</div>
</div>
</main>
<script>
        function simulateLogin() {
            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.remove('hidden');
            
            // Just a visual simulation, no real action needed for static UI
            setTimeout(() => {
                alert("Simulated: Successfully authenticated. Redirecting to Dashboard.");
                overlay.classList.add('hidden');
            }, 2500);
        }
    </script>


</body></html>
