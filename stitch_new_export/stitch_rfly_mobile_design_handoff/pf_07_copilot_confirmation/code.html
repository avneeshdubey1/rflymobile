<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RFLY Pilot - Copilot Confirmation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet"/>

                        "inverse-on-surface": "#f0f1f2",

                        "touch-target-min": "48px",

                        "stack-md": "16px",
                        "margin-mobile": "16px"

                    "fontFamily": {

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased h-screen flex flex-col pt-touch-target-min">
<!-- TopAppBar Semantic Shell (Hidden Navigation since it's a transactional flow, but keeping brand anchor) -->
<header class="fixed top-0 w-full flex items-center justify-between px-margin-mobile h-touch-target-min z-50 bg-surface border-b-2 border-outline-variant">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary cursor-pointer hover:bg-surface-container-high transition-colors p-2 rounded-full active:scale-95 duration-100" data-icon="arrow_back">arrow_back</span>
<h1 class="font-display-lg text-display-lg font-extrabold text-primary">RFLY Pilot</h1>
</div>
<span class="material-symbols-outlined text-secondary cursor-not-allowed p-2" data-icon="cloud_off">cloud_off</span>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col justify-center px-margin-mobile pb-stack-lg max-w-md mx-auto w-full relative z-10">
<!-- Confirmation Card (High Contrast White Container) -->
<div class="bg-surface-container-lowest border-2 border-outline-variant rounded-xl p-4 flex flex-col gap-stack-md shadow-none relative overflow-hidden">
<!-- Subtle background accent to indicate action required -->
<div class="absolute top-0 left-0 w-full h-2 bg-primary-container"></div>
<div class="flex items-start gap-4 pt-2">
<div class="bg-secondary-container text-on-secondary-container p-3 rounded-full flex-shrink-0">
<span class="material-symbols-outlined text-[32px]" data-icon="person_add" style="font-variation-settings: 'FILL' 1;">person_add</span>
</div>
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">Confirm Copilot</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Review selection details below.</p>
</div>
</div>
<div class="h-[1px] w-full bg-outline-variant my-1"></div>
<!-- Copilot Details -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center bg-surface-container-low p-3 rounded-lg border border-outline-variant">
<span class="font-body-md text-body-md text-on-surface-variant">Name</span>
<span class="font-headline-sm text-headline-sm text-on-surface">Alex Mercer</span>
</div>
<div class="flex justify-between items-center bg-surface-container-low p-3 rounded-lg border border-outline-variant">
<span class="font-body-md text-body-md text-on-surface-variant">Code</span>
<span class="font-data-lg text-data-lg text-primary tracking-widest">AM-8902</span>
</div>
</div>
<!-- Warning Callout -->
<div class="bg-error-container text-on-error-container border border-error rounded-lg p-3 flex gap-3 items-start mt-2">
<span class="material-symbols-outlined text-error flex-shrink-0" data-icon="warning">warning</span>
<p class="font-body-sm text-body-sm">
                    Assigning a copilot will set the crew status to <strong class="font-label-caps text-label-caps px-1 bg-surface-container text-on-surface rounded">READY</strong>. This does not accept or start the assignment.
                </p>
</div>
<!-- Actions -->
<div class="flex flex-col gap-stack-sm mt-stack-md">
<button class="h-touch-target-min w-full bg-primary text-on-primary font-headline-sm text-headline-sm rounded-full flex items-center justify-center gap-2 hover:opacity-90 active:scale-95 transition-all">
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
                    Confirm Selection
                </button>
<button class="h-touch-target-min w-full bg-transparent text-secondary border-2 border-secondary font-headline-sm text-headline-sm rounded-full flex items-center justify-center hover:bg-surface-container-low active:scale-95 transition-all">
                    Cancel
                </button>
</div>
</div>
</main>
<!-- BottomNavBar Semantic Shell (Suppressed for transactional screen as per guidelines, but JSON provided. Omitted here intentionally to follow the "Automatic Suppression" rule for transactional/linear flows). -->
</body></html>
