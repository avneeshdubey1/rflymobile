<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Floating Label Styles */
        .input-group {
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        .input-field {
            width: 100%;
            height: 48px; /* touch-target-min */
            padding: 12px 16px;
            background: transparent;
            border: 2px solid #8e7164; /* outline color */
            border-radius: 4px;
            color: #191c1d; /* on-surface */
            font-family: 'Hanken Grotesk', sans-serif;
            font-size: 16px;
            font-weight: 500;
            outline: none;
            transition: border-color 0.2s ease;
        }
        
        .input-field:focus {
            border-color: #4f5f7b; /* secondary color */
        }
        
        .input-label {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #f8f9fa; /* surface color */
            padding: 0 4px;
            color: #5a4136; /* on-surface-variant */
            font-family: 'Hanken Grotesk', sans-serif;
            font-size: 16px;
            pointer-events: none;
            transition: 0.2s ease all;
        }
        
        .input-field:focus ~ .input-label,
        .input-field:not(:placeholder-shown) ~ .input-label {
            top: 0;
            font-size: 12px;
            color: #4f5f7b; /* secondary color */
            font-weight: 800;
            letter-spacing: 0.08em;
        }
    </style>
</head>
<body class="bg-surface text-on-surface h-screen flex flex-col items-center justify-center font-body-md">
<div class="w-full max-w-md px-margin-mobile flex flex-col gap-stack-lg">
<!-- Header / Logo Area -->
<div class="flex flex-col items-center justify-center gap-stack-sm text-center mb-4">
<img src="https://lh3.googleusercontent.com/aida-public/AB6AXuD5nhwSERL2OEtNBMvAXrEq4tagVdQPL6UkvakTZjpfSPVgKvugsJf0sVaqFNtM529iaz9f9De-2npjI_kYWaFn2WqLAXTHkGSzqHuW54bI8k_H5n4XPTVdL98WT5E-wq3LvCD59ZJaffRS-N01OXMjR5Sj4b-8MMHu96mPr1Rnb9siNFq7LiJC6rSgPG9Ff4zs9hX0UCFfedNqPVd5epvnfAHkm2kxwK2dDFiM0oj7E3t3lsuwOCyQ" alt="RFLY Drone Logo" class="w-24 h-24 object-contain mb-2">
<h1 class="font-display-lg text-display-lg text-primary">RFLY Pilot</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Field Operations Terminal</p>
</div>
<!-- Error Banner Placeholder -->
<!-- Toggle hidden class via JS if needed -->
<div aria-live="assertive" class="hidden bg-error-container text-on-error-container border-2 border-error p-4 rounded flex items-center gap-stack-sm min-h-[48px]" id="error-banner" role="alert">
<span aria-hidden="true" class="material-symbols-outlined" data-icon="error">error</span>
<span class="font-body-md text-body-md font-bold">Invalid credentials or no connection.</span>
</div>
<!-- Login Form Container (Surface Card) -->
<div class="bg-surface-container-lowest border-2 border-surface-dim rounded-lg p-margin-mobile flex flex-col gap-stack-md w-full">
<form action="#" class="flex flex-col gap-stack-md" method="POST" onsubmit="event.preventDefault(); document.getElementById('error-banner').classList.remove('hidden');">
<!-- Email Input -->
<div class="input-group">
<input aria-label="Email Address" aria-required="true" class="input-field" id="email" name="email" placeholder=" " required="" type="email">
<label class="input-label" for="email">Email Address</label>
</div>
<!-- Password Input -->
<div class="input-group">
<input aria-label="Password" aria-required="true" class="input-field" id="password" name="password" placeholder=" " required="" type="password">
<label class="input-label" for="password">Password</label>
</div>
<!-- Primary Action Button -->
<button class="w-full h-touch-target-min bg-primary-container text-on-primary-container font-headline-sm text-headline-sm rounded-full flex items-center justify-center gap-2 hover:opacity-90 active:scale-95 transition-all mt-stack-sm" type="submit">
<span aria-hidden="true" class="material-symbols-outlined" data-icon="login">login</span>
                    Sign In
                </button>
</form>
</div>
<!-- System Status Footer -->
<div class="flex justify-center items-center gap-2 text-on-surface-variant opacity-70 mt-stack-md">
<span aria-hidden="true" class="material-symbols-outlined text-sm" data-icon="gpp_good">gpp_good</span>
<span class="font-data-sm text-data-sm uppercase tracking-wider">System Secure • v2.4.1</span>
</div>
</div>
