<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pilot Field - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#eff1f3",
                        "tertiary-fixed-dim": "#b9c7e0",
                        "status-warning": "#9A3412",
                        "on-secondary-fixed-variant": "#783200",
                        "surface-container-low": "#f2f4f6",
                        "outline-variant": "#c6c6cd",
                        "on-tertiary-fixed": "#0d1c2f",
                        "primary-container": "#131b2e",
                        "surface-tint": "#565e74",
                        "secondary-fixed": "#ffdbca",
                        "surface-container": "#eceef0",
                        "inverse-primary": "#bec6e0",
                        "error-container": "#ffdad6",
                        "rfly-blue": "#0F172A",
                        "on-background": "#191c1e",
                        "surface-variant": "#e0e3e5",
                        "on-surface": "#191c1e",
                        "surface-dim": "#d8dadc",
                        "on-secondary-fixed": "#341100",
                        "surface-slate": "#E2E8F0",
                        "tertiary-fixed": "#d5e3fd",
                        "primary": "#000000",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "on-tertiary-container": "#76859b",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#45464d",
                        "status-success": "#166534",
                        "secondary-fixed-dim": "#ffb690",
                        "on-error": "#ffffff",
                        "secondary-container": "#fd761a",
                        "surface-container-highest": "#e0e3e5",
                        "surface-bright": "#f7f9fb",
                        "surface-container-lowest": "#ffffff",
                        "outline": "#76777d",
                        "on-secondary": "#ffffff",
                        "tertiary-container": "#0d1c2f",
                        "surface": "#f7f9fb",
                        "tertiary": "#000000",
                        "on-primary-fixed": "#131b2e",
                        "on-primary-container": "#7c839b",
                        "background": "#f7f9fb",
                        "inverse-surface": "#2d3133",
                        "on-primary-fixed-variant": "#3f465c",
                        "on-secondary-container": "#5c2400",
                        "status-offline": "#475569",
                        "safety-orange": "#F97316",
                        "primary-fixed-dim": "#bec6e0",
                        "surface-container-high": "#e6e8ea",
                        "on-tertiary-fixed-variant": "#3a485c",
                        "primary-fixed": "#dae2fd",
                        "secondary": "#9d4300"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-lg": "24px",
                        "stack-md": "16px",
                        "gutter": "16px",
                        "margin-mobile": "20px",
                        "touch-target-min": "48px",
                        "stack-sm": "8px"
                    },
                    "fontFamily": {
                        "body-lg": ["IBM Plex Sans"],
                        "headline-md": ["IBM Plex Sans"],
                        "body-md": ["IBM Plex Sans"],
                        "headline-lg": ["IBM Plex Sans"],
                        "headline-lg-mobile": ["IBM Plex Sans"],
                        "data-mono": ["JetBrains Mono"],
                        "label-caps": ["IBM Plex Sans"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "data-mono": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg text-body-lg">
<!-- Top App Bar - Linear Transactional Intent (Suppressed Navigation Shell) -->
<!-- As per instructions, Login intent is linear/transactional, so no bottom nav/drawer. Just a simple header. -->
<header class="fixed top-0 w-full flex items-center justify-between px-margin-mobile h-touch-target-min z-50 bg-surface border-b border-surface-slate flat no shadows">
<div class="flex items-center gap-stack-sm">
<span class="material-symbols-outlined text-primary" data-weight="fill" style="font-variation-settings: 'FILL' 1;">flight_takeoff</span>
<span class="font-headline-md text-headline-md text-rfly-blue">Pilot Field</span>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex items-center justify-center p-margin-mobile pt-[calc(48px+20px)] pb-margin-mobile">
<!-- Login Container -->
<div class="w-full max-w-md bg-surface-container-lowest border border-surface-slate rounded-lg p-stack-lg shadow-md">
<div class="mb-stack-lg text-center">
<span class="material-symbols-outlined text-5xl text-rfly-blue mb-stack-sm" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock</span>
<h1 class="font-headline-lg text-headline-lg text-rfly-blue">Secure Login</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-stack-sm">Enter your credentials to access operations.</p>
</div>
<form class="flex flex-col gap-stack-md">
<!-- Employee ID -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface" for="emp-id">Employee ID</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">badge</span>
</div>
<input class="w-full h-touch-target-min pl-10 pr-3 border-[1.5px] border-outline rounded bg-surface-bright focus:border-rfly-blue focus:ring-1 focus:ring-rfly-blue font-data-mono text-data-mono text-on-surface placeholder:text-outline-variant transition-colors" id="emp-id" placeholder="e.g. OP-8492" required="" type="text"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">key</span>
</div>
<input class="w-full h-touch-target-min pl-10 pr-3 border-[1.5px] border-outline rounded bg-surface-bright focus:border-rfly-blue focus:ring-1 focus:ring-rfly-blue font-data-mono text-data-mono text-on-surface placeholder:text-outline-variant transition-colors" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Session Recovery / Forgot Password -->
<div class="flex justify-between items-center mt-stack-sm">
<div class="flex items-center">
<input class="h-4 w-4 text-rfly-blue border-outline rounded focus:ring-rfly-blue" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-md text-body-md text-on-surface-variant" for="remember-me">Remember me</label>
</div>
<a class="font-body-md text-body-md text-rfly-blue font-bold hover:underline" href="#">Session Recovery</a>
</div>
<!-- Submit Button -->
<button class="w-full h-touch-target-min mt-stack-md bg-rfly-blue text-on-primary font-headline-md text-headline-md rounded hover:bg-inverse-surface active:scale-95 transition-all shadow-sm flex items-center justify-center gap-2" type="submit">
<span>Authenticate</span>
<span class="material-symbols-outlined text-on-primary">arrow_forward</span>
</button>
</form>
<!-- Physical Token Divider -->
<div class="mt-stack-lg relative">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-surface-slate"></div>
</div>
<div class="relative flex justify-center">
<span class="px-2 bg-surface-container-lowest font-body-md text-body-md text-on-surface-variant">Or use physical key</span>
</div>
</div>
<!-- Hardware Token Login -->
<button class="w-full h-touch-target-min mt-stack-md bg-surface border border-outline-variant text-on-surface font-headline-md text-headline-md rounded hover:bg-surface-container transition-colors flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 1;">usb</span>
<span>Insert Security Token</span>
</button>
</div>
</main>
</body></html>
