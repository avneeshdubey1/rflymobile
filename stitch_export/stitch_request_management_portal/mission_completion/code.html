<body class="bg-background text-on-background antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-on-background w-full top-0 sticky border-b border-outline-variant dark:border-on-surface-variant flex items-center justify-between px-margin-mobile h-touch-target-min z-40">
<div class="flex items-center gap-stack-sm cursor-pointer hover:bg-surface-container-high transition-colors active:opacity-80 rounded p-1">
<span class="material-symbols-outlined text-primary dark:text-inverse-primary" data-icon="close">close</span>
</div>
<div class="font-headline-md text-headline-md font-bold text-primary dark:text-inverse-primary">
            RFLY Ops
        </div>
<div class="flex items-center gap-stack-sm">
<div class="w-8 h-8 rounded-full overflow-hidden bg-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant text-sm" data-icon="person">person</span>
</div>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-grow p-margin-mobile flex flex-col md:max-w-2xl md:mx-auto md:w-full space-y-stack-lg">
<div class="space-y-stack-sm">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Post-Mission Entry</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Log operational data for Mission Alpha-Tango.</p>
</div>
<form class="space-y-stack-lg flex-grow">
<!-- Data Entry Card -->
<div class="bg-surface-container-lowest rounded-xl p-gutter border border-surface-slate space-y-stack-md">
<div class="space-y-stack-sm">
<label class="block font-label-caps text-label-caps text-on-surface" for="acreage">Actual Acreage</label>
<div class="relative rounded-md shadow-sm">
<input class="block w-full rounded-md border-1.5 border-outline-variant bg-surface-bright p-3 font-data-mono text-data-mono text-on-surface focus:border-rfly-blue focus:ring-rfly-blue sm:text-sm h-touch-target-min" id="acreage" inputmode="decimal" name="acreage" placeholder="0.00" step="0.01" type="number">
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3">
<span class="font-body-md text-body-md text-on-surface-variant">Acres</span>
</div>
</div>
</div>
<div class="space-y-stack-sm">
<label class="block font-label-caps text-label-caps text-on-surface" for="notes">Mission Notes</label>
<div class="mt-1">
<textarea class="block w-full rounded-md border-1.5 border-outline-variant bg-surface-bright p-3 font-body-md text-body-md text-on-surface focus:border-rfly-blue focus:ring-rfly-blue sm:text-sm" id="notes" name="notes" placeholder="Observe terrain changes, anomalies, etc." rows="4"></textarea>
</div>
</div>
</div>
<!-- Offline Sync Status Card -->
<div class="bg-surface-container-low rounded-xl p-gutter border border-surface-slate flex flex-col gap-stack-sm">
<div class="flex justify-between items-center">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-status-offline" data-icon="cloud_off">cloud_off</span>
<h3 class="font-label-caps text-label-caps text-on-surface">Pending Sync</h3>
</div>
<span class="bg-surface-dim text-on-surface px-2 py-1 rounded font-data-mono text-data-mono text-[10px]">3 ITEMS</span>
</div>
<div class="w-full bg-surface-slate h-2 rounded-full overflow-hidden">
<div class="bg-safety-orange h-full w-[0%] rounded-full" id="sync-progress" style="width: 15%; transition: width 1s ease-in-out;"></div>
</div>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">Data will sync automatically when connection is restored.</p>
</div>
</form>
<!-- Fixed Action Area -->
<div class="pt-stack-md mt-auto pb-safe">
<a href="{{DATA:SCREEN:SCREEN_6}}" class="w-full h-touch-target-min bg-rfly-blue hover:bg-primary-container text-on-primary rounded shadow-md flex items-center justify-center gap-2 transition-colors">
<span class="material-symbols-outlined" data-icon="sync" style="font-variation-settings: 'FILL' 1;">sync</span>
<span class="font-label-caps text-label-caps tracking-widest uppercase">Complete &amp; Sync</span>
</a>
</div>
</main>
<script>
        // Simple script to demonstrate offline sync bar
        document.addEventListener('DOMContentLoaded', () => {
            const syncProgress = document.getElementById('sync-progress');
            // Simulate a pending state, it shouldn't fill if offline, but showing a sliver to indicate a queue
            setTimeout(() => {
                syncProgress.style.width = '15%';
                syncProgress.style.transition = 'width 1s ease-in-out';
            }, 500);
        });
    </script>
