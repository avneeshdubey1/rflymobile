# Demo-only override for the shared office server described in
# the current office production stack. Operational guidance is in deploy/README.md.
#
# Use only with compose.production.yml:
#   docker compose --env-file /opt/client-demo-app/deployment.env \
#     -f compose.production.yml -f compose.onprem-demo.yml up --detach --build
#
# This override intentionally supports a direct HTTP demo on host port 8088
# without changing the existing Jitsi/Nginx installation. Do not use it as a
# production or internet-facing security baseline.

services:
  # Docker is installed from Snap on this host. Its confinement rejects every
  # container process launch when no-new-privileges is requested. Reset only
  # that unsupported option here; non-root users, dropped capabilities,
  # read-only filesystems, isolated networks and resource limits remain.
  migrate:
    security_opt: !reset []

  backend:
    security_opt: !reset []
    environment:
      NODE_ENV: development
      ENFORCE_HTTPS: "false"
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      OTP_DELIVERY_PROVIDER: ${OTP_DELIVERY_PROVIDER:-disabled}

  frontend:
    security_opt: !reset []
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8088}:8080"
