# One-shot, operator-controlled farmer workbook import overlay.
#
# The workbook directory and encryption key are mounted only into this isolated
# image. They are never copied into the API/frontend images or a Docker layer.
# Invoke this overlay together with compose.production.yml after creating and
# verifying a database backup. The import CLI remains fail-closed until its
# dry-run batch has an active Admin approval.

services:
  # Offline parser for the mandatory first gate. It has no database secret,
  # no staging key, no network, and never starts migrations.
  importer-preflight:
    image: ${IMPORTER_IMAGE:-field-operations-importer}:${IMAGE_TAG:-local}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: importer
    user: "${IMPORTER_UID:-1000}:${IMPORTER_GID:-1000}"
    environment:
      NODE_ENV: production
      APP_RUNTIME_MODE: importer-preflight
    volumes:
      - type: bind
        source: ${IMPORT_WORKBOOK_DIRECTORY:?Set IMPORT_WORKBOOK_DIRECTORY to an absolute directory outside the repository}
        target: /imports/input
        read_only: true
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    mem_limit: ${IMPORTER_MEMORY_LIMIT:-768m}
    cpus: ${IMPORTER_CPU_LIMIT:-1.0}

  importer:
    image: ${IMPORTER_IMAGE:-field-operations-importer}:${IMAGE_TAG:-local}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: importer
    user: "${IMPORTER_UID:-1000}:${IMPORTER_GID:-1000}"
    environment:
      NODE_ENV: production
      APP_RUNTIME_MODE: importer
      DEPLOYMENT_NAME: ${DEPLOYMENT_NAME:?Set DEPLOYMENT_NAME}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      DATABASE_NAME: ${POSTGRES_DB:?Set POSTGRES_DB}
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      IMPORT_STAGING_KEY_FILE: /run/secrets/import_staging_key
      IMPORT_STAGING_KEY_VERSION: ${IMPORT_STAGING_KEY_VERSION:-v1}
    secrets:
      - db_password
      - import_staging_key
    volumes:
      - type: bind
        source: ${IMPORT_WORKBOOK_DIRECTORY:?Set IMPORT_WORKBOOK_DIRECTORY to an absolute directory outside the repository}
        target: /imports/input
        read_only: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    mem_limit: ${IMPORTER_MEMORY_LIMIT:-768m}
    cpus: ${IMPORTER_CPU_LIMIT:-1.0}

  # The client supplied its drone master as an expanded browser-inspector
  # export. This offline gate parses that exact format without database access.
  drone-importer-preflight:
    image: ${IMPORTER_IMAGE:-field-operations-importer}:${IMAGE_TAG:-local}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: importer
    entrypoint: ["/bin/sh", "/usr/local/bin/operations-entrypoint", "node", "importer/droneCli.js"]
    user: "${IMPORTER_UID:-1000}:${IMPORTER_GID:-1000}"
    environment:
      NODE_ENV: production
      APP_RUNTIME_MODE: importer-preflight
    volumes:
      - type: bind
        source: ${IMPORT_WORKBOOK_DIRECTORY:?Set IMPORT_WORKBOOK_DIRECTORY to an absolute directory outside the repository}
        target: /imports/input
        read_only: true
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    mem_limit: ${IMPORTER_MEMORY_LIMIT:-768m}
    cpus: ${IMPORTER_CPU_LIMIT:-1.0}

  # Commit gate for the drone master. Unlike the farmer workbook importer it
  # needs no payload-encryption key because source rows are never staged in DB.
  drone-importer:
    image: ${IMPORTER_IMAGE:-field-operations-importer}:${IMAGE_TAG:-local}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: importer
    entrypoint: ["/bin/sh", "/usr/local/bin/operations-entrypoint", "node", "importer/droneCli.js"]
    user: "${IMPORTER_UID:-1000}:${IMPORTER_GID:-1000}"
    environment:
      NODE_ENV: production
      APP_RUNTIME_MODE: importer
      DEPLOYMENT_NAME: ${DEPLOYMENT_NAME:?Set DEPLOYMENT_NAME}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      DATABASE_NAME: ${POSTGRES_DB:?Set POSTGRES_DB}
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - type: bind
        source: ${IMPORT_WORKBOOK_DIRECTORY:?Set IMPORT_WORKBOOK_DIRECTORY to an absolute directory outside the repository}
        target: /imports/input
        read_only: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    mem_limit: ${IMPORTER_MEMORY_LIMIT:-768m}
    cpus: ${IMPORTER_CPU_LIMIT:-1.0}

  # Client master import: dropdowns, cluster records and inactive fleet roster.
  # PRICE is intentionally excluded by its parser. This service shares the
  # same reviewed input mount but has no source-row staging key.
  client-master-importer-preflight:
    image: ${IMPORTER_IMAGE:-field-operations-importer}:${IMAGE_TAG:-local}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: importer
    entrypoint: ["/bin/sh", "/usr/local/bin/operations-entrypoint", "node", "importer/clientMasterCli.js"]
    user: "${IMPORTER_UID:-1000}:${IMPORTER_GID:-1000}"
    environment:
      NODE_ENV: production
      APP_RUNTIME_MODE: importer-preflight
    volumes:
      - type: bind
        source: ${IMPORT_WORKBOOK_DIRECTORY:?Set IMPORT_WORKBOOK_DIRECTORY to an absolute directory outside the repository}
        target: /imports/input
        read_only: true
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    mem_limit: ${IMPORTER_MEMORY_LIMIT:-768m}
    cpus: ${IMPORTER_CPU_LIMIT:-1.0}

  client-master-importer:
    image: ${IMPORTER_IMAGE:-field-operations-importer}:${IMAGE_TAG:-local}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: importer
    entrypoint: ["/bin/sh", "/usr/local/bin/operations-entrypoint", "node", "importer/clientMasterCli.js"]
    user: "${IMPORTER_UID:-1000}:${IMPORTER_GID:-1000}"
    environment:
      NODE_ENV: production
      APP_RUNTIME_MODE: importer
      DEPLOYMENT_NAME: ${DEPLOYMENT_NAME:?Set DEPLOYMENT_NAME}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      DATABASE_NAME: ${POSTGRES_DB:?Set POSTGRES_DB}
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - type: bind
        source: ${IMPORT_WORKBOOK_DIRECTORY:?Set IMPORT_WORKBOOK_DIRECTORY to an absolute directory outside the repository}
        target: /imports/input
        read_only: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    mem_limit: ${IMPORTER_MEMORY_LIMIT:-768m}
    cpus: ${IMPORTER_CPU_LIMIT:-1.0}

secrets:
  import_staging_key:
    file: ${IMPORT_STAGING_KEY_FILE:?Set IMPORT_STAGING_KEY_FILE to an absolute host path outside the repository}
